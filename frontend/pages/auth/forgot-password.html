<template id="forgot-password-template">
    <div class="top-bar">
        <div class="logo" id="forgot-logo">
            <span class="logo-icon"><i class="fas fa-graduation-cap" style="transform: rotate(-45deg);"></i></span>
            LearnUP
        </div>
        <div class="top-bar-right">
            <span class="text-gray">Remembered it?</span>
            <a href="#" class="link-blue" id="forgot-go-login">Sign In</a>
        </div>
    </div>

    <div class="center-content">
        <div class="auth-card" style="width:440px;">

            <!-- ===== STEP 1: Enter Email ===== -->
            <div id="fp-step-1" class="fp-step">
                <!-- Icon -->
                <div class="fp-icon-wrap">
                    <div class="fp-icon-circle">
                        <i class="fa-solid fa-lock-open"></i>
                    </div>
                </div>

                <h2 style="text-align:center;">Forgot Password?</h2>
                <p class="subtitle" style="text-align:center;">
                    Enter your email address and we'll send you a verification code.
                </p>

                <div id="fp-error-1" class="fp-alert fp-alert-error" style="display:none;"></div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div style="position:relative;">
                        <i class="fa-solid fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
                        <input type="email" id="fp-email" placeholder="Enter your email" style="padding-left:40px;">
                    </div>
                </div>

                <button class="btn-primary" id="fp-send-btn" style="margin-top:4px;">
                    <span id="fp-send-btn-text"><i class="fa-solid fa-paper-plane" style="margin-right:8px;"></i>Send Verification Code</span>
                </button>

                <!-- Step indicator -->
                <div class="fp-steps-indicator">
                    <div class="fp-step-dot active" title="Enter email"></div>
                    <div class="fp-step-line"></div>
                    <div class="fp-step-dot" title="Enter code"></div>
                    <div class="fp-step-line"></div>
                    <div class="fp-step-dot" title="New password"></div>
                </div>
            </div>

            <!-- ===== STEP 2: Enter OTP ===== -->
            <div id="fp-step-2" class="fp-step" style="display:none;">
                <div class="fp-icon-wrap">
                    <div class="fp-icon-circle fp-icon-amber">
                        <i class="fa-solid fa-envelope-open-text"></i>
                    </div>
                </div>

                <h2 style="text-align:center;">Check Your Email</h2>
                <p class="subtitle" style="text-align:center;">
                    We sent a 6-digit code to<br>
                    <strong id="fp-email-display" style="color:#2563eb;"></strong>
                </p>

                <div id="fp-error-2" class="fp-alert fp-alert-error" style="display:none;"></div>
                <div id="fp-success-2" class="fp-alert fp-alert-success" style="display:none;"></div>

                <!-- OTP Input Grid -->
                <div class="fp-otp-grid" id="fp-otp-inputs">
                    <input type="text" class="fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>

                <!-- Timer -->
                <div class="fp-timer" id="fp-timer-wrap">
                    <i class="fa-regular fa-clock"></i>
                    Code expires in <strong id="fp-timer">09:59</strong>
                </div>

                <button class="btn-primary" id="fp-verify-btn">
                    <span id="fp-verify-btn-text"><i class="fa-solid fa-circle-check" style="margin-right:8px;"></i>Verify Code</span>
                </button>

                <p style="text-align:center;margin-top:16px;font-size:13px;color:#64748b;">
                    Didn't receive it?
                    <a href="#" id="fp-resend" class="link-blue" style="font-weight:600;">Resend code</a>
                </p>

                <!-- Step indicator -->
                <div class="fp-steps-indicator">
                    <div class="fp-step-dot done" title="Enter email"></div>
                    <div class="fp-step-line fp-step-line-done"></div>
                    <div class="fp-step-dot active" title="Enter code"></div>
                    <div class="fp-step-line"></div>
                    <div class="fp-step-dot" title="New password"></div>
                </div>
            </div>

            <!-- ===== STEP 3: New Password ===== -->
            <div id="fp-step-3" class="fp-step" style="display:none;">
                <div class="fp-icon-wrap">
                    <div class="fp-icon-circle fp-icon-green">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

                <h2 style="text-align:center;">Create New Password</h2>
                <p class="subtitle" style="text-align:center;">
                    Your identity is verified. Set a strong new password.
                </p>

                <div id="fp-error-3" class="fp-alert fp-alert-error" style="display:none;"></div>

                <div class="form-group">
                    <label>New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="fp-new-pass" placeholder="At least 8 characters">
                        <button class="toggle-pw" id="fp-toggle-new"><i class="far fa-eye"></i></button>
                    </div>
                    <!-- Strength meter -->
                    <div class="strength-meter" id="fp-strength-meter">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <p class="fp-strength-label" id="fp-strength-label"></p>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="fp-confirm-pass" placeholder="Repeat your password">
                        <button class="toggle-pw" id="fp-toggle-confirm"><i class="far fa-eye"></i></button>
                    </div>
                    <p class="error-text" id="fp-match-error" style="display:none;">
                        <i class="fa-solid fa-circle-exclamation"></i> Passwords do not match
                    </p>
                </div>

                <button class="btn-primary" id="fp-reset-btn">
                    <span id="fp-reset-btn-text"><i class="fa-solid fa-key" style="margin-right:8px;"></i>Reset Password</span>
                </button>

                <!-- Step indicator -->
                <div class="fp-steps-indicator">
                    <div class="fp-step-dot done" title="Enter email"></div>
                    <div class="fp-step-line fp-step-line-done"></div>
                    <div class="fp-step-dot done" title="Enter code"></div>
                    <div class="fp-step-line fp-step-line-done"></div>
                    <div class="fp-step-dot active" title="New password"></div>
                </div>
            </div>

            <!-- ===== STEP 4: Success ===== -->
            <div id="fp-step-success" class="fp-step" style="display:none;text-align:center;">
                <div class="fp-icon-wrap">
                    <div class="fp-icon-circle fp-icon-green fp-success-bounce">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                </div>
                <h2>Password Reset!</h2>
                <p class="subtitle">Your password has been successfully updated. You can now sign in with your new password.</p>
                <button class="btn-primary" id="fp-goto-login">
                    <i class="fa-solid fa-right-to-bracket" style="margin-right:8px;"></i>Sign In Now
                </button>
            </div>

        </div>
    </div>

    <footer class="full-footer">
        <span>© 2026 LearnUP. All rights reserved.</span>
        <div class="footer-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
        </div>
    </footer>
</template>
