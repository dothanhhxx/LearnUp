<template id="change-password-modal-template">
    <!-- Change Password Modal Overlay -->
    <div id="change-password-overlay" class="cp-overlay">
        <div class="cp-modal">
            <!-- Close button -->
            <button class="cp-close" id="cp-close-btn" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Header -->
            <div class="cp-header">
                <div class="cp-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="cp-title">Change Password</h2>
                <p class="cp-subtitle">Keep your account secure with a strong password.</p>
            </div>

            <!-- Alerts -->
            <div id="cp-error" class="fp-alert fp-alert-error" style="display:none;"></div>
            <div id="cp-success" class="fp-alert fp-alert-success" style="display:none;"></div>

            <!-- Form -->
            <div class="form-group">
                <label>Current Password</label>
                <div class="password-wrapper">
                    <input type="password" id="cp-current" placeholder="Enter your current password">
                    <button class="toggle-pw" id="cp-toggle-current"><i class="far fa-eye"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="cp-new" placeholder="At least 8 characters">
                    <button class="toggle-pw" id="cp-toggle-new"><i class="far fa-eye"></i></button>
                </div>
                <div class="strength-meter" id="cp-strength-meter">
                    <span></span><span></span><span></span><span></span>
                </div>
                <p class="fp-strength-label" id="cp-strength-label"></p>
            </div>

            <div class="form-group" style="margin-bottom:28px;">
                <label>Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="cp-confirm" placeholder="Repeat new password">
                    <button class="toggle-pw" id="cp-toggle-confirm"><i class="far fa-eye"></i></button>
                </div>
                <p class="error-text" id="cp-match-error" style="display:none;">
                    <i class="fa-solid fa-circle-exclamation"></i> Passwords do not match
                </p>
            </div>

            <button class="btn-primary" id="cp-submit-btn">
                <span id="cp-submit-text">
                    <i class="fa-solid fa-shield-halved" style="margin-right:8px;"></i>Update Password
                </span>
            </button>
        </div>
    </div>
</template>
